<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
        }

        .profile-card {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .image-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #6c5ce7;
            padding: 3px;
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 14px;
            color: #6c5ce7;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 13px;
            color: #636e72;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: #6c5ce7;
            color: #ffffff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #5a4bcf;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="image-container">
            <!-- Yahan aapki 'Khadar' naam ki image attach kar di gayi hai -->
            <img src="Khadar.jpg" alt="Profile Picture">
        </div>
        
        <h2 class="name">Ayesha</h2>
        <p class="tagline">Web Developer & Content Creator</p>
        <p class="bio">Passionate about building responsive websites, creating engaging digital content, and exploring AI technology.</p>
        
        <a href="#" class="btn">Connect</a>
    </div>

</body>
</html>
